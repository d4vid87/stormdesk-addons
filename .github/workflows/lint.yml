name: lint

on:
  push:
  pull_request:

jobs:
  addon:
    name: add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./weatherdesk

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck weatherdesk/run.sh
